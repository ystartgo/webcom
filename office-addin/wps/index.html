<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Webcom WPS Add-in</title>
</head>
<body>
    <script>
    function OnToggleTaskPane(control) {
        try {
            var tsId = wps.PluginStorage.getItem("webcom_wps_taskpane_id");
            if (tsId) {
                var tp = wps.GetTaskPane(tsId);
                if (tp) {
                    tp.Visible = !tp.Visible;
                    return true;
                }
            }
            var newTp = wps.CreateTaskPane("https://127.0.0.1:8002/office-addin/taskpane.html", "Webcom AI 智慧助理");
            if (newTp) {
                wps.PluginStorage.setItem("webcom_wps_taskpane_id", newTp.ID);
                newTp.Visible = true;
                newTp.Width = 330;
            }
        } catch(e) {
            alert("開啟 Webcom 側邊欄失敗: " + (e.message || String(e)));
        }
        return true;
    }
    </script>
</body>
</html>
