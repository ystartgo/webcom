<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>選取 Web Serial 序列埠設備</title>
  <style>
    body {
      margin: 0; padding: 24px; background: #0f172a; color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 280px; text-align: center; box-sizing: border-box;
    }
    .icon { font-size: 44px; margin-bottom: 12px; }
    h2 { margin: 0 0 8px 0; font-size: 16px; color: #38bdf8; font-weight: bold; }
    p { margin: 0 0 20px 0; font-size: 12px; color: #94a3b8; line-height: 1.6; max-width: 360px; }
    button {
      background: #2563eb; color: #fff; border: 1px solid #3b82f6;
      padding: 10px 24px; border-radius: 8px; font-size: 13px; font-weight: bold;
      cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }
    button:hover { background: #1d4ed8; }
    .note { margin-top: 16px; font-size: 11px; color: #64748b; font-family: monospace; }
  </style>
</head>
<body>
  <div class="icon">🔌</div>
  <h2>選取 Web Serial 序列埠設備</h2>
  <p>Chrome 安全規範規定序列埠設備選擇對話盒必須在頂層視窗中彈出。<br>請點擊下方按鈕以開啟系統序列埠 (COM Port) 設備清單：</p>
  <button id="btn-request" type="button">🔌 點此選取序列埠 (Select Port)</button>
  <div class="note">授權後此視窗將自動關閉，並立即連線</div>
  <script src="select_port.js"></script>
</body>
</html>
