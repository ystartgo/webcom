<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webcom Sandboxed Artifact Host</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030712;
    }
    #sandbox-child {
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="sandbox-child" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"></iframe>
  <script>
    let pendingCode = null;

    function render(html) {
      const child = document.getElementById('sandbox-child');
      if (child) {
        child.srcdoc = html || '';
      }
    }

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'RENDER_CODE') {
        const html = e.data.html || '';
        const child = document.getElementById('sandbox-child');
        if (child) {
          render(html);
        } else {
          pendingCode = html;
        }
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      if (pendingCode) {
        render(pendingCode);
      }
      try {
        window.parent.postMessage({ type: 'SANDBOX_READY' }, '*');
      } catch (err) {}
    });
  </script>
</body>
</html>
